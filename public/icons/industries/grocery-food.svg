<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 48">
  <defs><style>
    .gf0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .gf1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Cart handle + top rail -->
  <polyline class="gf0" points="4,8 10,8 16,36 42,36"/>
  <!-- Basket bottom -->
  <line class="gf0" x1="14" y1="16" x2="44" y2="16"/>
  <!-- Basket left side -->
  <line class="gf0" x1="14" y1="16" x2="16" y2="36"/>
  <!-- Basket right side -->
  <line class="gf0" x1="44" y1="16" x2="42" y2="36"/>
  <!-- Wheels -->
  <circle class="gf0" cx="22" cy="42" r="4"/>
  <circle class="gf0" cx="38" cy="42" r="4"/>
  <!-- Accent: items in cart -->
  <line class="gf1" x1="26" y1="20" x2="26" y2="32"/>
  <line class="gf1" x1="32" y1="19" x2="32" y2="32"/>
</svg>
