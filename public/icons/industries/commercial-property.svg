<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52">
  <defs><style>
    .cp0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .cp1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Building outline (flat roof — distinct from hotel's peaked roof) -->
  <rect class="cp0" x="4" y="4" width="36" height="44"/>
  <!-- Parapet cap line -->
  <line class="cp0" x1="2" y1="4" x2="42" y2="4"/>
  <!-- Window grid: 3 cols × 4 rows -->
  <rect class="cp0" x="8" y="10" width="7" height="5"/>
  <rect class="cp0" x="18" y="10" width="7" height="5"/>
  <rect class="cp0" x="29" y="10" width="7" height="5"/>
  <rect class="cp0" x="8" y="19" width="7" height="5"/>
  <rect class="cp0" x="18" y="19" width="7" height="5"/>
  <rect class="cp0" x="29" y="19" width="7" height="5"/>
  <rect class="cp0" x="8" y="28" width="7" height="5"/>
  <rect class="cp0" x="18" y="28" width="7" height="5"/>
  <rect class="cp0" x="29" y="28" width="7" height="5"/>
  <rect class="cp0" x="8" y="37" width="7" height="5"/>
  <!-- Accent: one lit window (middle col, second row) -->
  <rect class="cp1" x="18" y="19" width="7" height="5"/>
  <rect class="cp0" x="29" y="37" width="7" height="5"/>
  <!-- Entry door -->
  <rect class="cp0" x="18" y="38" width="8" height="10"/>
</svg>
