<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs><style>
    .hf0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .hf1{fill:none;stroke:#208b46;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Circle -->
  <circle class="hf0" cx="24" cy="24" r="20"/>
  <!-- Vertical arm of cross (charcoal) -->
  <line class="hf0" x1="24" y1="10" x2="24" y2="38"/>
  <!-- Horizontal arm of cross (accent green) -->
  <line class="hf1" x1="10" y1="24" x2="38" y2="24"/>
</svg>
