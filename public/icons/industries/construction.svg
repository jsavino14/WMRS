<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .cn0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .cn1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Mast -->
  <line class="cn0" x1="16" y1="40" x2="16" y2="4"/>
  <!-- Horizontal jib: counter-jib (left) + main jib (right) -->
  <line class="cn0" x1="4" y1="8" x2="40" y2="8"/>
  <!-- Tension cables from mast peak to jib ends -->
  <line class="cn0" x1="16" y1="4" x2="40" y2="8"/>
  <line class="cn0" x1="16" y1="4" x2="4" y2="8"/>
  <!-- Hoist rope (accent) -->
  <line class="cn1" x1="30" y1="8" x2="30" y2="28"/>
  <!-- Hook (accent) -->
  <path class="cn1" d="M 28,28 Q 26,34 30,34 Q 34,32 32,28"/>
</svg>
