  <!-- Skylights on sloped sections -->
  <line class="mw0" x1="9" y1="12" x2="14" y2="18"/>
  <line class="mw1" x1="27" y1="12" x2="32" y2="18"/>
  <line class="mw0" x1="45" y1="12" x2="50" y2="18"/>
  <!-- Ground-level door -->
  <rect class="mw0" x="22" y="28" width="10" height="12"/>
</svg>
