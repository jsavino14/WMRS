<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .mw0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .mw1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Left upright -->
  <line class="mw0" x1="7" y1="4" x2="7" y2="40"/>
  <!-- Right upright -->
  <line class="mw0" x1="37" y1="4" x2="37" y2="40"/>
  <!-- Base -->
  <line class="mw0" x1="4" y1="40" x2="40" y2="40"/>
  <!-- Lower shelf beam -->
  <line class="mw0" x1="7" y1="28" x2="37" y2="28"/>
  <!-- Upper shelf beam -->
  <line class="mw0" x1="7" y1="14" x2="37" y2="14"/>
  <!-- Lower tier — left pallet -->
  <rect class="mw0" x="9" y="30" width="11" height="8"/>
  <!-- Lower tier — right pallet (accent) -->
  <rect class="mw1" x="22" y="30" width="11" height="8"/>
  <!-- Upper tier — left pallet -->
  <rect class="mw0" x="9" y="16" width="11" height="10"/>
  <!-- Upper tier — right pallet -->
  <rect class="mw0" x="22" y="16" width="11" height="10"/>
</svg>
