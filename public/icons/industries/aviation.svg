<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .av0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .av1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Vertical stabiliser / tail fin: swept leading edge, flat top, vertical trailing edge -->
