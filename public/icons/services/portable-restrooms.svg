<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .pr0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pr1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Cistern: vertical rectangle at rear, upper portion -->
  <rect class="pr0" x="28" y="8" width="11" height="14" rx="1"/>
  <!-- Bowl: oval in front of and below cistern -->
  <ellipse class="pr0" cx="18" cy="29" rx="10" ry="7"/>
  <!-- Seat: horizontal line across bowl top, meeting cistern front face (accent) -->
  <line class="pr1" x1="8" y1="22" x2="28" y2="22"/>
  <!-- Pedestal -->
  <line class="pr0" x1="18" y1="36" x2="18" y2="39"/>
  <!-- Floor line -->
  <line class="pr0" x1="12" y1="39" x2="24" y2="39"/>
</svg>
