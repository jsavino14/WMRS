<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .pr0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pr1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Roof cap — peaked, overhangs body both sides, softly curved (accent) -->
  <path class="pr1" d="M10,18 C10,14 16,10 22,10 C28,10 34,14 34,18"/>
  <!-- Body rectangle -->
  <rect class="pr0" x="13" y="18" width="18" height="20"/>
  <!-- Door — arched top, most of front face -->
  <path class="pr0" d="M16,38 L16,26 A6,5 0 0 0 28,26 L28,38"/>
  <!-- Vent lines near arch top -->
  <line class="pr0" x1="19" y1="23" x2="25" y2="23"/>
  <line class="pr0" x1="19" y1="25" x2="25" y2="25"/>
  <!-- Feet at base -->
  <line class="pr0" x1="11" y1="39" x2="15" y2="39"/>
  <line class="pr0" x1="29" y1="39" x2="33" y2="39"/>
</svg>
