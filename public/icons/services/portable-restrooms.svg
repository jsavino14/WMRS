<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .pr0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .pr1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Tank (back/right) -->
  <rect class="pr0" x="26" y="8" width="12" height="14" rx="1"/>
  <!-- Bowl (front/left, oval) -->
  <ellipse class="pr0" cx="16" cy="28" rx="10" ry="6"/>
  <!-- Seat line (accent) -->
  <line class="pr1" x1="6" y1="22" x2="26" y2="22"/>
  <!-- Base -->
  <line class="pr0" x1="8" y1="34" x2="30" y2="34"/>
</svg>
