<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .er0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .er1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Weigh deck platform -->
  <rect class="er0" x="5" y="22" width="34" height="6"/>
  <!-- Approach ramps either side -->
  <line class="er0" x1="2" y1="28" x2="5" y2="22"/>
  <line class="er0" x1="42" y1="28" x2="39" y2="22"/>
  <!-- Left side rail (end guard) -->
  <line class="er0" x1="5" y1="18" x2="5" y2="22"/>
  <!-- Right side rail (end guard) -->
  <line class="er0" x1="39" y1="18" x2="39" y2="22"/>
  <!-- Support legs -->
  <line class="er0" x1="13" y1="28" x2="13" y2="36"/>
  <line class="er0" x1="31" y1="28" x2="31" y2="36"/>
  <!-- Ground -->
  <line class="er0" x1="2" y1="36" x2="42" y2="36"/>
  <!-- Indicator post and display (accent — one unit) -->
  <line class="er1" x1="13" y1="22" x2="13" y2="10"/>
  <rect class="er1" x="9" y="6" width="8" height="6"/>
</svg>
