<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .eq0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .eq1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Baler outer shell (tall narrow box) -->
  <rect class="eq0" x="13" y="8" width="18" height="24"/>
  <!-- Press ram plate at top -->
  <rect class="eq0" x="11" y="4" width="22" height="5"/>
  <!-- Compressed bale at base of chamber (accent) -->
  <rect class="eq1" x="15" y="25" width="14" height="5"/>
  <!-- Bale tie straps (accent) -->
  <line class="eq1" x1="19" y1="25" x2="19" y2="30"/>
  <line class="eq1" x1="25" y1="25" x2="25" y2="30"/>
  <!-- Frame legs -->
  <line class="eq0" x1="13" y1="32" x2="9" y2="40"/>
  <line class="eq0" x1="31" y1="32" x2="35" y2="40"/>
  <!-- Ground -->
  <line class="eq0" x1="6" y1="40" x2="38" y2="40"/>
</svg>
