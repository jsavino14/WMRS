<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .tc0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tc1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Body: rear wall full height (right), horizontal top ~2/3, slope down to shorter front wall -->
  <path class="tc0" d="M3,18 L15,10 L41,10 L41,30 L3,30 Z"/>
  <!-- Corrugation ribs (stop container reading as a plain box) -->
  <line class="tc0" x1="21" y1="11" x2="21" y2="29"/>
  <line class="tc0" x1="28" y1="11" x2="28" y2="29"/>
  <line class="tc0" x1="35" y1="11" x2="35" y2="29"/>
  <!-- Wheels under rear portion -->
  <circle class="tc0" cx="27" cy="34" r="2.5"/>
  <circle class="tc1" cx="36" cy="34" r="2.5"/>
</svg>
