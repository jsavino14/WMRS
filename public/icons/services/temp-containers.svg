<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .tc0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tc1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Container body: front wall + bottom + sloped rear end — open at top -->
  <path class="tc0" d="M5,13 L5,29 L40,29 L32,13"/>
  <!-- Hook bar projecting from front -->
  <path class="tc0" d="M5,20 L2,20 L2,24"/>
  <!-- Front roller -->
  <circle class="tc0" cx="11" cy="33" r="2.5"/>
  <!-- Rear roller (accent) -->
  <circle class="tc1" cx="33" cy="33" r="2.5"/>
</svg>
