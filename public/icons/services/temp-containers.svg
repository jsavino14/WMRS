<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .tc0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tc1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Rim — full length, overhangs both ends (accent) -->
  <line class="tc1" x1="2" y1="19" x2="42" y2="19"/>
  <!-- Body — left wall and bottom; open top -->
  <path class="tc0" d="M4,20 L4,30 L40,30"/>
  <!-- Right-end post — rises ~1/3 body height above rim -->
  <line class="tc0" x1="40" y1="16" x2="40" y2="30"/>
  <!-- Ribs — 6 evenly spaced -->
  <line class="tc0" x1="9"  y1="20" x2="9"  y2="30"/>
  <line class="tc0" x1="14" y1="20" x2="14" y2="30"/>
  <line class="tc0" x1="19" y1="20" x2="19" y2="30"/>
  <line class="tc0" x1="25" y1="20" x2="25" y2="30"/>
  <line class="tc0" x1="30" y1="20" x2="30" y2="30"/>
  <line class="tc0" x1="35" y1="20" x2="35" y2="30"/>
  <!-- Ground line -->
  <line class="tc0" x1="2" y1="32" x2="42" y2="32"/>
</svg>
