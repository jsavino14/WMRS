<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs><style>
    .ev0{fill:none;stroke:#262d34;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ev1{fill:none;stroke:#208b46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- Tank body: top and bottom straight lines -->
  <line class="ev0" x1="10" y1="14" x2="34" y2="14"/>
  <line class="ev0" x1="10" y1="30" x2="34" y2="30"/>
  <!-- Left elliptical end cap (cylindrical) -->
  <ellipse class="ev0" cx="10" cy="22" rx="5" ry="8"/>
  <!-- Right elliptical end cap (cylindrical) -->
  <ellipse class="ev0" cx="34" cy="22" rx="5" ry="8"/>
  <!-- Left support saddle -->
  <path class="ev0" d="M7,30 L5,40 L15,40 L13,30"/>
  <!-- Right support saddle -->
  <path class="ev0" d="M31,30 L29,40 L39,40 L37,30"/>
  <!-- Vent pipe and valve fitting on top (accent — one unit) -->
  <line class="ev1" x1="22" y1="14" x2="22" y2="8"/>
  <circle class="ev1" cx="22" cy="6" r="2.5"/>
</svg>
